# Alp Lab fork CI. The upstream workflows (test, check, lint, format, build,
# document, audit) are disabled in this repository's Actions settings, so they
# never run here. The org shares a 20-job Actions limit with Signex, so this
# workflow runs only on pull requests into `dev`/`signex` and on pushes to them,
# on Ubuntu only. See .github/CONTRIBUTING.md.
name: Fork CI
on:
  pull_request:
    branches: [dev, signex]
  push:
    branches: [dev, signex]
concurrency:
  group: fork-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: --deny warnings
  ICED_TEST_BACKEND: tiny-skia
jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - name: Changelog fragments
        run: bash changelog.d/assemble.sh --check

  lint:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # libgtk-3-dev is for rfd (tester, editor example). The .deb downloads
      # are cached; see the action for why.
      - name: Install Linux dependencies
        uses: ./.github/actions/linux-deps
        with:
          packages: libxkbcommon-dev libgtk-3-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo lint

  test:
    name: nextest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # libgtk-3-dev is for rfd (tester, editor example). The .deb downloads
      # are cached; see the action for why.
      - name: Install Linux dependencies
        uses: ./.github/actions/linux-deps
        with:
          packages: libxkbcommon-dev libgtk-3-dev mesa-vulkan-drivers
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Tests (all features)
        # mesa-vulkan-drivers provides lavapipe (software Vulkan), so the
        # offscreen render tests run; they fail instead of skipping without it.
        env:
          ICED_REQUIRE_GPU_TESTS: 1
        run: cargo nextest run --workspace --all-features --no-fail-fast
      - name: Doc tests
        run: cargo test --workspace --all-features --doc

  wasm:
    name: check wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --package iced --target wasm32-unknown-unknown

  required:
    name: fork-ci · required
    if: always()
    needs: [fmt, lint, test, wasm]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        run: |
          for r in "${{ needs.fmt.result }}" "${{ needs.lint.result }}" "${{ needs.test.result }}" "${{ needs.wasm.result }}"; do
            [ "$r" = "success" ] || { echo "a required job ended with: $r"; exit 1; }
          done
